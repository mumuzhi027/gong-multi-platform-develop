# Site: gonggong.mumuzhi.cloud
# Recommended document root: /www/wwwroot/gonggong.mumuzhi.cloud
# Keep BaoTa-generated SSL/domain/root lines. Merge these location blocks inside server { ... }.
# Paste inside the existing server block of a dedicated PWA site.
# Keep the panel-managed domain, document root and HTTPS certificates.
# Replace matching location blocks; do not define them twice.
    location ^~ /api/ {
        proxy_pass http://101.43.27.78:8000/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    # Use the same legal-document web service as the native app.
    location ^~ /web/ {
        proxy_pass http://101.43.27.78:8000/;
        proxy_set_header Host $proxy_host;
    }
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /static/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ^~ /pwa/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
