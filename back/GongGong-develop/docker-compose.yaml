services:
  #  主服务
  api:
    build: ./ems-sdk
    environment:
      - TZ=Asia/Shanghai
      - ENV=prod
      - LOG_ACCOUNT_IDS=${LOG_ACCOUNT_IDS:-true}
    volumes:
      - /etc/localtime:/etc/localtime:ro  # 设置时区
      - api-logs:/logs
  #  代理缓存服务
  proxy:
    build: ./cached_proxy
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - SPIDER_URL=http://api:8080
      - ACTIVITY_SUPERADMIN_NAME=${ACTIVITY_SUPERADMIN_NAME:-三翼青融媒体中心}
      - ACTIVITY_SUPERADMIN_PASSWORD=${ACTIVITY_SUPERADMIN_PASSWORD:-}
      - ACTIVITY_ADMIN_ACCOUNTS_JSON=${ACTIVITY_ADMIN_ACCOUNTS_JSON:-}
      - ACTIVITY_ADMIN_TOKEN=${ACTIVITY_ADMIN_TOKEN:-}
      - ACTIVITY_ADMIN_ORIGIN=${ACTIVITY_ADMIN_ORIGIN:-*}
      - ACTIVITY_DATA_DIR=/app/_data/activities
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4.1-flash}
      - SESSION_VAULT_MASTER_KEY=${SESSION_VAULT_MASTER_KEY:-}
      - LOG_ACCOUNT_IDS=${LOG_ACCOUNT_IDS:-true}
    volumes:
      - proxy_files:/app/_data
      - /etc/localtime:/etc/localtime:ro  # 设置时区
  #  反馈服务

volumes:
  api-logs:
  proxy_files:
